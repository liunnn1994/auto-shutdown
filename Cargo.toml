[package]
name = "auto-shutdown"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.6"
anyhow = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = "0.30.0"
futures = "0.3.34"
serde = "1.0.229"
serde_json = "1.0.151"
aes = "0.9.3"
ctr = "0.10.1"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
